<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Station Editor — Portfolio Map</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #04040e; color: #e4e4e8; font-family: 'JetBrains Mono', monospace; display: flex; height: 100vh; overflow: hidden; }

  /* ── Sidebar ─────────────────────────────────────── */
  #sidebar {
    width: 340px; min-width: 340px;
    background: #07070f;
    border-right: 1px solid rgba(0,255,204,0.15);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  #sidebar-header {
    padding: 14px 16px;
    border-bottom: 1px solid rgba(0,255,204,0.15);
    flex-shrink: 0;
  }
  #sidebar-header h2 { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: #00ffcc; }
  #sidebar-header p  { font-size: 9px; color: #444466; margin-top: 4px; line-height: 1.5; }

  /* ── Station list ────────────────────────────────── */
  #station-list { flex: 1; overflow-y: auto; padding: 6px 0; }
  .sta-row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 14px; cursor: pointer; font-size: 10px;
    border-left: 3px solid transparent; transition: all 0.1s;
  }
  .sta-row:hover { background: rgba(255,255,255,0.04); }
  .sta-row.selected { background: rgba(255,255,255,0.07); }
  .sta-dot { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; transform: rotate(45deg); border-radius: 2px; }
  .sta-name { flex: 1; color: #aaaacc; }
  .sta-pos  { color: #444466; font-size: 9px; }

  /* ── Station edit panel ──────────────────────────── */
  #station-edit {
    flex-shrink: 0; overflow-y: auto; max-height: 60%;
    padding: 14px 16px;
    border-top: 1px solid rgba(0,255,204,0.12);
    background: #050510;
  }
  #station-edit h3 {
    font-size: 10px; color: #00ffcc; letter-spacing: 2px;
    margin-bottom: 12px; padding-bottom: 6px;
    border-bottom: 1px solid rgba(0,255,204,0.1);
  }

  .field { margin-bottom: 9px; }
  .field label { display: block; font-size: 9px; color: #555577; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 3px; }
  .field input[type=text], .field input[type=url] {
    width: 100%; background: #0c0c1e;
    border: 1px solid rgba(0,255,204,0.2);
    color: #e4e4e8; padding: 6px 9px;
    font-size: 10px; font-family: inherit;
    border-radius: 3px; outline: none;
    transition: border-color 0.15s;
  }
  .field input:focus { border-color: #00ffcc; }
  .field input::placeholder { color: #2a2a44; }

  .pos-display {
    font-size: 10px; color: #00ffcc; letter-spacing: 1px;
    padding: 5px 9px;
    background: rgba(0,255,204,0.05);
    border: 1px solid rgba(0,255,204,0.15);
    border-radius: 3px;
    cursor: default;
  }

  /* Colour swatches */
  .swatch-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  .swatch {
    width: 22px; height: 22px;
    border-radius: 4px; cursor: pointer;
    border: 2px solid transparent; transition: all 0.12s;
  }
  .swatch:hover  { transform: scale(1.15); }
  .swatch.active { border-color: #ffffff; transform: scale(1.15); }

  /* Action buttons */
  .btn-row { display: flex; gap: 7px; margin-top: 10px; }
  .btn {
    flex: 1; padding: 8px 4px;
    border-radius: 3px; cursor: pointer;
    font-family: inherit; font-size: 9px;
    letter-spacing: 2px; text-transform: uppercase;
    transition: background 0.15s; border: 1px solid;
  }
  .btn-green { color: #00ffcc; border-color: rgba(0,255,204,0.5); background: rgba(0,255,204,0.07); }
  .btn-green:hover { background: rgba(0,255,204,0.18); }
  .btn-yellow { color: #ffdd00; border-color: rgba(255,220,0,0.5); background: rgba(255,220,0,0.06); }
  .btn-yellow:hover { background: rgba(255,220,0,0.16); }
  .btn-red { color: #ff6666; border-color: rgba(255,80,80,0.5); background: rgba(255,60,60,0.06); }
  .btn-red:hover { background: rgba(255,60,60,0.16); }
  .btn-export {
    width: 100%; margin-top: 10px; padding: 9px;
    border-radius: 3px; cursor: pointer;
    font-family: inherit; font-size: 10px;
    letter-spacing: 2px; text-transform: uppercase;
    color: #00ffcc; border: 1px solid #00ffcc;
    background: rgba(0,255,204,0.08);
    transition: background 0.15s;
  }
  .btn-export:hover { background: rgba(0,255,204,0.2); }

  /* ── Canvas ──────────────────────────────────────── */
  #canvas-wrap { flex: 1; position: relative; overflow: hidden; }
  canvas#track { width: 100%; height: 100%; cursor: crosshair; }

  #status {
    position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
    font-size: 9px; color: #444466; letter-spacing: 2px;
    background: rgba(0,0,0,0.75); padding: 5px 14px; border-radius: 3px;
    pointer-events: none;
  }
  #coords-tip {
    position: absolute; top: 12px; right: 12px;
    font-size: 9px; color: #333355; letter-spacing: 1px;
    background: rgba(0,0,0,0.6); padding: 4px 10px; border-radius: 3px;
    pointer-events: none;
  }

  /* ── Output modal ────────────────────────────────── */
  #output-modal {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.87); z-index: 100;
    align-items: center; justify-content: center;
  }
  #output-modal.show { display: flex; }
  #output-box {
    background: #07070f; border: 1px solid #00ffcc;
    border-radius: 6px; padding: 20px; width: 780px; max-height: 80vh;
    display: flex; flex-direction: column; gap: 12px;
  }
  #output-box h3 { font-size: 11px; color: #00ffcc; letter-spacing: 3px; }
  #output-text {
    flex: 1; overflow-y: auto; background: #020210;
    border: 1px solid rgba(0,255,204,0.2); padding: 14px;
    font-size: 10px; color: #aaffdd; line-height: 1.9;
    white-space: pre; border-radius: 3px;
  }
  .modal-btns { display: flex; gap: 10px; }
  .modal-btns button {
    flex: 1; padding: 9px; background: rgba(0,255,204,0.1);
    border: 1px solid #00ffcc; color: #00ffcc; font-family: inherit;
    font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
    cursor: pointer; border-radius: 3px;
  }
  .modal-btns button:hover { background: rgba(0,255,204,0.22); }
</style>
</head>
<body>

<!-- ── Sidebar ──────────────────────────────────────────── -->
<div id="sidebar">
  <div id="sidebar-header">
    <h2>🏎 Station Editor</h2>
    <p>Drag a ◆ pin to position it on the track map.<br>
       Edit content below, then export to objects.js.</p>
  </div>

  <div id="station-list"></div>

  <div id="station-edit">
    <h3 id="edit-heading">STATION 1</h3>

    <div class="field">
      <label>World position (drag pin on map)</label>
      <div class="pos-display" id="pos-display">—</div>
    </div>

    <div class="field">
      <label>Label (shown on minimap)</label>
      <input type="text" id="f-label" placeholder="e.g. HPC CLUSTER">
    </div>

    <div class="field">
      <label>Tag line</label>
      <input type="text" id="f-tag" placeholder="// PROJECT">
    </div>
    <div class="field">
      <label>Title</label>
      <input type="text" id="f-title" placeholder="e.g. HPC CLUSTER">
    </div>
    <div class="field">
      <label>Org / Year</label>
      <input type="text" id="f-org" placeholder="2023 · NUS">
    </div>
    <div class="field">
      <label>Type badge</label>
      <input type="text" id="f-type" placeholder="COMPETITION">
    </div>
    <div class="field">
      <label>Photo path (optional, relative to /public)</label>
      <input type="url" id="f-photo" placeholder="/img/my-photo.jpg">
    </div>

    <div class="field">
      <label>Colour</label>
      <div class="swatch-row" id="swatches"></div>
    </div>

    <div class="btn-row">
      <button class="btn btn-green"  id="btn-add">+ New</button>
      <button class="btn btn-yellow" id="btn-dup">⧉ Duplicate</button>
      <button class="btn btn-red"    id="btn-del">✕ Delete</button>
    </div>

    <button class="btn-export" id="btn-export">⬇ Copy STATION_CONFIGS code</button>
  </div>
</div>

<!-- ── Canvas ───────────────────────────────────────────── -->
<div id="canvas-wrap">
  <canvas id="track"></canvas>
  <div id="status">drag a ◆ pin to reposition • select to edit</div>
  <div id="coords-tip">hover for world coords</div>
</div>

<!-- ── Output modal ─────────────────────────────────────── -->
<div id="output-modal">
  <div id="output-box">
    <h3>📋 PASTE INTO src/three/objects.js → STATION_CONFIGS</h3>
    <div id="output-text"></div>
    <div class="modal-btns">
      <button onclick="navigator.clipboard.writeText(document.getElementById('output-text').textContent).then(()=>this.textContent='✓ Copied!')">Copy to clipboard</button>
      <button onclick="document.getElementById('output-modal').classList.remove('show')">Close</button>
    </div>
  </div>
</div>

<script>
// ── Hardcoded circuit shape (read-only reference) ──────────────────
const PTS = [
  { x:  615, z:   10 }, { x:  590, z: -460 }, { x:  505, z: -495 },
  { x:  445, z: -525 }, { x:  420, z: -430 }, { x:  450, z: -145 },
  { x: -100, z: -235 }, { x: -410, z: -375 }, { x: -505, z: -210 },
  { x: -550, z: -240 }, { x: -645, z: -385 }, { x: -700, z: -410 },
  { x: -775, z: -265 }, { x: -850, z:  -75 }, { x: -750, z:    5 },
  { x: -735, z:   70 }, { x: -615, z:  175 }, { x: -565, z:  200 },
  { x: -545, z:  165 }, { x: -545, z:   15 }, { x: -490, z: -135 },
  { x: -345, z:   10 }, { x:   90, z:   20 }, { x:  150, z:  125 },
  { x:  535, z:  115 },
];

// ── Station data — keep in sync with STATION_CONFIGS in objects.js ──
let stations = [
  {
    id: 's1', label: 'SBCC26',
    x: -600, z: -245, color: '#ffdd00',
    tag: '', title: 'SBCC26', org: 'SINGLE BOARD CLUSTER COMPETITION 2026', type: 'COMPETITION', photo: '',
  },
  {
    id: 's2', label: 'AI-HPC26',
    x: -630, z: -295, color: '#66aaff',
    tag: '', title: 'AI-HPC26', org: '2026 · NUS · Team Kent Ridge', type: 'COMPETITION', photo: '',
  },
  {
    id: 's3', label: 'CUDA MATRIX MULTIPLICATION',
    x: -300, z: -20, color: '#66ffaa',
    tag: '', title: 'CUDA MATRIX MULTIPLICATION', org: '2026', type: 'PROJECT', photo: '',
  },
  {
    id: 's4', label: 'FPGA MATRIX CALCULATION',
    x: -225, z: -15, color: '#ff9933',
    tag: '// PROJECT', title: 'FPGA MATRIX CALCULATION', org: '2026', type: 'PROJECT', photo: '',
  },
  {
    id: 's5', label: 'RHCSA',
    x: 165, z: 70, color: '#ff6655',
    tag: '', title: 'RED HAT CERTIFIED SYSTEMS ADMIN', org: '2026', type: 'CERTIFICATION', photo: '',
  },
  {
    id: 's6', label: 'NCP - AIIO',
    x: 195, z: 100, color: '#cc88ff',
    tag: '// PROJECT', title: 'NVIDIA AI INFRA. & OPS', org: '2026', type: 'CERTIFICATION', photo: '',
  },
];

const COLORS = ['#ffdd00','#ff6655','#66aaff','#66ffaa','#ff9933','#cc88ff','#00ffcc','#ff88cc','#ffffff'];

let selectedIdx   = 0;
let draggingIdx   = null;

// ── Canvas ─────────────────────────────────────────────────────────
const canvas = document.getElementById('track');
const ctx    = canvas.getContext('2d');

function resize() {
  const w = canvas.parentElement;
  canvas.width  = w.clientWidth;
  canvas.height = w.clientHeight;
  draw();
}
window.addEventListener('resize', resize);

function getTransform() {
  const PAD = 60, W = canvas.width-PAD*2, H = canvas.height-PAD*2;
  const allX = [...PTS.map(p=>p.x), ...stations.map(s=>s.x)];
  const allZ = [...PTS.map(p=>p.z), ...stations.map(s=>s.z)];
  const minX=Math.min(...allX)-80, maxX=Math.max(...allX)+80;
  const minZ=Math.min(...allZ)-80, maxZ=Math.max(...allZ)+80;
  const scale = Math.min(W/(maxX-minX), H/(maxZ-minZ));
  const offX = PAD + (W-(maxX-minX)*scale)/2;
  const offZ = PAD + (H-(maxZ-minZ)*scale)/2;
  return { minX, minZ, scale, offX, offZ };
}
const w2c = (x,z) => { const t=getTransform(); return { cx: t.offX+(x-t.minX)*t.scale, cy: t.offZ+(z-t.minZ)*t.scale }; };
const c2w = (cx,cy) => { const t=getTransform(); return { x:(cx-t.offX)/t.scale+t.minX, z:(cy-t.offZ)/t.scale+t.minZ }; };

function crPt(p0,p1,p2,p3,t) {
  const s=0.44, t2=t*t, t3=t2*t;
  return {
    x: s*(-p0.x+3*p1.x-3*p2.x+p3.x)*t3+s*(2*p0.x-5*p1.x+4*p2.x-p3.x)*t2+s*(-p0.x+p2.x)*t+p1.x,
    z: s*(-p0.z+3*p1.z-3*p2.z+p3.z)*t3+s*(2*p0.z-5*p1.z+4*p2.z-p3.z)*t2+s*(-p0.z+p2.z)*t+p1.z,
  };
}

function draw() {
  const W=canvas.width, H=canvas.height;
  ctx.clearRect(0,0,W,H);

  // Grid
  ctx.strokeStyle='rgba(255,255,255,0.025)'; ctx.lineWidth=1;
  for (let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for (let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}

  // Track spline
  const n=PTS.length;
  ctx.beginPath(); let first=true;
  for (let i=0;i<n;i++) {
    const p0=PTS[(i-1+n)%n],p1=PTS[i],p2=PTS[(i+1)%n],p3=PTS[(i+2)%n];
    for (let s=0;s<10;s++) {
      const p=crPt(p0,p1,p2,p3,s/10);
      const {cx,cy}=w2c(p.x,p.z);
      first?ctx.moveTo(cx,cy):ctx.lineTo(cx,cy); first=false;
    }
  }
  const s0=w2c(PTS[0].x,PTS[0].z); ctx.lineTo(s0.cx,s0.cy);
  ctx.strokeStyle='rgba(0,255,204,0.15)'; ctx.lineWidth=getTransform().scale*22; ctx.stroke();
  ctx.strokeStyle='rgba(0,255,204,0.6)';  ctx.lineWidth=1.5; ctx.stroke();

  // Start arrow
  const a0=w2c(PTS[0].x,PTS[0].z), a1=w2c(PTS[1].x,PTS[1].z);
  const ang=Math.atan2(a1.cy-a0.cy, a1.cx-a0.cx);
  ctx.save(); ctx.translate(a0.cx,a0.cy); ctx.rotate(ang);
  ctx.fillStyle='#ff7b00'; ctx.beginPath();
  ctx.moveTo(14,0);ctx.lineTo(-5,6);ctx.lineTo(-5,-6);ctx.closePath();ctx.fill();
  ctx.restore();

  // Station pins
  stations.forEach((sta, i) => {
    const {cx,cy} = w2c(sta.x, sta.z);
    const sel  = (i === selectedIdx);
    const drag = (i === draggingIdx);
    const r = sel||drag ? 9 : 6;

    // Glow rings for active pin
    if (sel||drag) {
      [r+14, r+7].forEach((gr, gi) => {
        ctx.beginPath(); ctx.arc(cx,cy,gr,0,Math.PI*2);
        ctx.fillStyle = sta.color + (gi===0?'22':'44'); ctx.fill();
      });
      ctx.strokeStyle=sta.color+'88'; ctx.lineWidth=1; ctx.setLineDash([3,3]);
      ctx.beginPath(); ctx.moveTo(cx-28,cy); ctx.lineTo(cx+28,cy); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx,cy-28); ctx.lineTo(cx,cy+28); ctx.stroke();
      ctx.setLineDash([]);
    }

    // Diamond pin
    ctx.beginPath();
    ctx.moveTo(cx,cy-r); ctx.lineTo(cx+r,cy); ctx.lineTo(cx,cy+r); ctx.lineTo(cx-r,cy); ctx.closePath();
    ctx.fillStyle   = sta.color;
    ctx.strokeStyle = sel||drag ? '#ffffff' : sta.color+'66';
    ctx.lineWidth   = sel||drag ? 2 : 1;
    ctx.fill(); ctx.stroke();

    // Label
    ctx.fillStyle = sel||drag ? '#ffffff' : sta.color+'cc';
    ctx.font      = `${sel||drag?'bold ':''  }9px monospace`;
    ctx.fillText(`${i+1}. ${sta.label}  (${Math.round(sta.x)}, ${Math.round(sta.z)})`, cx+r+7, cy+3);
  });
}

// ── Station list ────────────────────────────────────────────────────
function buildList() {
  const el = document.getElementById('station-list');
  el.innerHTML = '';
  stations.forEach((sta, i) => {
    const row = document.createElement('div');
    row.className = 'sta-row'+(i===selectedIdx?' selected':'');
    row.style.borderLeftColor = i===selectedIdx ? sta.color : 'transparent';
    row.innerHTML = `
      <div class="sta-dot" style="background:${sta.color}"></div>
      <span class="sta-name">${i+1}. ${sta.label}</span>
      <span class="sta-pos">(${Math.round(sta.x)}, ${Math.round(sta.z)})</span>`;
    row.onclick = () => { selectedIdx=i; refresh(); };
    el.appendChild(row);
  });
}

function updateEditPanel() {
  const sta = stations[selectedIdx]; if (!sta) return;
  document.getElementById('edit-heading').textContent = `STATION ${selectedIdx+1}`;
  document.getElementById('pos-display').textContent  = `new THREE.Vector3(${Math.round(sta.x)}, 0, ${Math.round(sta.z)})`;
  document.getElementById('f-label').value = sta.label || '';
  document.getElementById('f-tag').value   = sta.tag   || '';
  document.getElementById('f-title').value = sta.title || '';
  document.getElementById('f-org').value   = sta.org   || '';
  document.getElementById('f-type').value  = sta.type  || '';
  document.getElementById('f-photo').value = sta.photo || '';
  document.querySelectorAll('.swatch').forEach(sw =>
    sw.classList.toggle('active', sw.dataset.color===sta.color));
}

function refresh() { buildList(); updateEditPanel(); draw(); }

// Live field binding
[['f-label','label'],['f-tag','tag'],['f-title','title'],['f-org','org'],['f-type','type'],['f-photo','photo']].forEach(([id,key]) => {
  document.getElementById(id).addEventListener('input', e => {
    const sta=stations[selectedIdx]; if(!sta)return;
    sta[key]=e.target.value;
    if(key==='label'){buildList();}
    draw();
  });
});

// Colour swatches
function buildSwatches() {
  const el=document.getElementById('swatches');
  COLORS.forEach(col => {
    const sw=document.createElement('div');
    sw.className='swatch'; sw.style.background=col; sw.dataset.color=col; sw.title=col;
    sw.onclick = () => {
      stations[selectedIdx].color=col;
      document.querySelectorAll('.swatch').forEach(s=>s.classList.toggle('active',s.dataset.color===col));
      buildList(); draw();
    };
    el.appendChild(sw);
  });
}

// ── CRUD ────────────────────────────────────────────────────────────
document.getElementById('btn-add').onclick = () => {
  stations.push({ id:'s'+Date.now(), label:'NEW STATION', x:0, z:0, color:'#66aaff',
    tag:'// PROJECT', title:'NEW STATION', org:'', type:'', photo:'' });
  selectedIdx=stations.length-1; refresh();
};

document.getElementById('btn-dup').onclick = () => {
  const src=stations[selectedIdx]; if(!src)return;
  const clone=Object.assign({},src,{id:'s'+Date.now(), x:src.x+40, z:src.z+40, label:src.label+' (copy)'});
  stations.splice(selectedIdx+1,0,clone);
  selectedIdx=selectedIdx+1; refresh();
};

document.getElementById('btn-del').onclick = () => {
  if(stations.length<=1){alert('Need at least 1 station');return;}
  stations.splice(selectedIdx,1);
  selectedIdx=Math.min(selectedIdx,stations.length-1);
  refresh();
};

// ── Export ──────────────────────────────────────────────────────────
document.getElementById('btn-export').onclick = () => {
  const q = s => `'${s}'`;
  const entries = stations.map((sta,i) => {
    let panels = `      makeAboutCanvas(${q(sta.tag)}, ${q(sta.title)}, ${q(sta.org)}, ${q(sta.type)})`;
    if (sta.photo) panels += `,\n      makeImageCanvas(${q(sta.photo)})`;
    panels += `,\n      makeAboutCanvas('// DETAILS', ${q(sta.title)}, '', '')`;
    return `  {\n    pos:   new THREE.Vector3(${Math.round(sta.x)}, 0, ${Math.round(sta.z)}),\n    label: ${q(sta.label)},\n    panels: [\n${panels},\n    ],\n  }`;
  }).join(',\n');
  document.getElementById('output-text').textContent =
    `// ── Paste this into src/three/objects.js ─────────────────\nexport const STATION_CONFIGS = [\n${entries},\n];`;
  document.getElementById('output-modal').classList.add('show');
};

// ── Mouse ────────────────────────────────────────────────────────────
canvas.addEventListener('mousedown', e => {
  const rect=canvas.getBoundingClientRect();
  const mx=e.clientX-rect.left, my=e.clientY-rect.top;
  let nearest=-1, bestD=22**2;
  stations.forEach((sta,i) => {
    const {cx,cy}=w2c(sta.x,sta.z);
    const d=(cx-mx)**2+(cy-my)**2;
    if(d<bestD){bestD=d;nearest=i;}
  });
  if(nearest>=0){ draggingIdx=nearest; selectedIdx=nearest; refresh(); }
});

canvas.addEventListener('mousemove', e => {
  const rect=canvas.getBoundingClientRect();
  const mx=e.clientX-rect.left, my=e.clientY-rect.top;
  const {x,z}=c2w(mx,my);
  document.getElementById('coords-tip').textContent = `x: ${Math.round(x)}  z: ${Math.round(z)}`;
  if(draggingIdx===null)return;
  stations[draggingIdx].x=Math.round(x/5)*5;
  stations[draggingIdx].z=Math.round(z/5)*5;
  updateEditPanel(); buildList(); draw();
});

canvas.addEventListener('mouseup',    () => { draggingIdx=null; draw(); });
canvas.addEventListener('mouseleave', () => { draggingIdx=null; draw(); });

// ── Init ─────────────────────────────────────────────────────────────
buildSwatches();
refresh();
resize();
</script>
</body>
</html>
